<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Vaibhav Pathak, AI Engineer">
<style>
  .fade { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .node { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both; transform-box: fill-box; transform-origin: center; }
  .flow { stroke-dasharray: 6 8; animation: dash 1.4s linear infinite; }
  .core { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes dash { to { stroke-dashoffset: -28; } }
  @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .8; transform: scale(1.25); } }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </pattern>
  <radialGradient id="glow" cx="78%" cy="50%" r="45%">
    <stop offset="0" stop-color="#ff6b6b" stop-opacity=".16"/>
    <stop offset="1" stop-color="#ff6b6b" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bar" x1="0" x2="1">
    <stop offset="0" stop-color="#ff6b6b"/><stop offset="1" stop-color="#ffb86b"/>
  </linearGradient>
  <clipPath id="clip"><rect width="1200" height="360" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="360" fill="#0d1117"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <rect width="1200" height="4" fill="url(#bar)"/>
</g>
<rect x=".5" y=".5" width="1199" height="359" rx="18" fill="none" stroke="#30363d"/>

<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <text x="64" y="92" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#ff6b6b" class="fade" style="animation-delay:.05s">~/jaipur/vaibhav-pathak $ whoami</text>
  <text x="62" y="168" font-size="66" font-weight="700" fill="#e6edf3" letter-spacing="-1.5" class="fade" style="animation-delay:.15s">Vaibhav Pathak</text>
  <g class="fade" style="animation-delay:.3s">
    <text x="64" y="214" font-size="25" fill="#e6edf3">AI Engineer <tspan fill="#8b949e">·</tspan> I build agents that do real work<tspan fill="#ff6b6b" class="cursor">_</tspan></text>
  </g>
  <g class="fade" style="animation-delay:.45s" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#8b949e">
    <text x="64" y="268">agentic pipelines  ·  business automation  ·  backend &amp; data</text>
    <text x="64" y="294">freelancing as <tspan fill="#ffb86b">Studio Arc</tspan>  ·  weekend hardware tinkerer</text>
  </g>
</g>

<g>
  <line x1="930" y1="180" x2="930" y2="50" stroke="#4fd1c5" stroke-opacity=".55" stroke-width="1.6" class="flow" style="animation-delay:-0.00s"/><line x1="930" y1="180" x2="1110" y2="110" stroke="#ffb86b" stroke-opacity=".55" stroke-width="1.6" class="flow" style="animation-delay:-0.35s"/><line x1="930" y1="180" x2="1110" y2="255" stroke="#a78bfa" stroke-opacity=".55" stroke-width="1.6" class="flow" style="animation-delay:-0.70s"/><line x1="930" y1="180" x2="930" y2="315" stroke="#ff6b6b" stroke-opacity=".55" stroke-width="1.6" class="flow" style="animation-delay:-1.05s"/><line x1="930" y1="180" x2="760" y2="270" stroke="#ffb86b" stroke-opacity=".55" stroke-width="1.6" class="flow" style="animation-delay:-1.40s"/><line x1="930" y1="180" x2="760" y2="95" stroke="#4fd1c5" stroke-opacity=".55" stroke-width="1.6" class="flow" style="animation-delay:-1.75s"/>
  <circle cx="930" cy="180" r="46" fill="#ff6b6b" class="core"/>
  <circle cx="930" cy="180" r="38" fill="#161b22" stroke="#ff6b6b" stroke-width="2"/>
  <text x="930" y="187" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" font-weight="700" fill="#ff6b6b">agent</text>
  <g class="node" style="animation-delay:0.60s"><rect x="889.4" y="35" width="81.2" height="30" rx="15" fill="#161b22" stroke="#4fd1c5" stroke-width="1.4"/><text x="930" y="55" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e6edf3">WhatsApp</text></g><g class="node" style="animation-delay:0.72s"><rect x="1077.8" y="95" width="64.4" height="30" rx="15" fill="#161b22" stroke="#ffb86b" stroke-width="1.4"/><text x="1110" y="115" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e6edf3">Sheets</text></g><g class="node" style="animation-delay:0.84s"><rect x="1082.0" y="240" width="56.0" height="30" rx="15" fill="#161b22" stroke="#a78bfa" stroke-width="1.4"/><text x="1110" y="260" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e6edf3">Tally</text></g><g class="node" style="animation-delay:0.96s"><rect x="902.0" y="300" width="56.0" height="30" rx="15" fill="#161b22" stroke="#ff6b6b" stroke-width="1.4"/><text x="930" y="320" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e6edf3">Reels</text></g><g class="node" style="animation-delay:1.08s"><rect x="715.2" y="255" width="89.6" height="30" rx="15" fill="#161b22" stroke="#ffb86b" stroke-width="1.4"/><text x="760" y="275" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e6edf3">Instagram</text></g><g class="node" style="animation-delay:1.20s"><rect x="732.0" y="80" width="56.0" height="30" rx="15" fill="#161b22" stroke="#4fd1c5" stroke-width="1.4"/><text x="760" y="100" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#e6edf3">ESP32</text></g>
</g>
</svg>